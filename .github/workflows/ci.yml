name: Validate FORGE
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_CACHE: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit
      # The branded-food catalogue is generated from the pinned USDA release
      # (204 MB download, verified by SHA-256), never committed. The archive
      # is cached between runs; see scripts/branded-catalog.
      - uses: actions/cache@v4
        with:
          path: .cache/branded-catalog
          key: usda-branded-${{ hashFiles('scripts/branded-catalog/sources.json') }}
      - run: npm run branded:ensure
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:ui
      - run: npm run export
      - uses: actions/upload-artifact@v4
        with:
          name: forge-native-export
          path: dist
